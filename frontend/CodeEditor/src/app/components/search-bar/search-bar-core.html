@if(isVisible()) {
    <div class="search-bar-container">
        <input id="search-bar" type="text" placeholder="Search for Git repository.."  (input)="onSearch($event)" >

        @if(listDisplayedElement().length > 0) {
        <ul class="search-results">
            @for(repo of listDisplayedElement(); track repo.id) {
            <li class="search-result-item" >
                {{ repo.name }}
            </li>
            }
        </ul>
        }
    </div>
}
