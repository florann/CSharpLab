# ============================================================
# RabbitMQ - Full K3s Deployment
# Namespace: rabbitmq-workerservices
# Apply with: kubectl apply -f k8s/rabbitmq.yaml
# ============================================================

# [File generated by Claude - For learning purpose, all settings have been filled by hand, only structure is generated]

# ------------------------------------------------------------
# NAMESPACE
# Isolates all rabbitmq-workerservices resources from other clusters
# ------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: rabbitmq-workerservices

---
# ------------------------------------------------------------
# SECRET
# Stores sensitive RabbitMQ credentials
# ⚠️ In production, use a secrets manager (Vault, Sealed Secrets)
# ------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: rabbitmq-workerservices
type: Opaque
stringData:
  username: admin   # RabbitMQ admin username
  password: admin123   # RabbitMQ admin password

---
# ------------------------------------------------------------
# CONFIGMAP
# Stores non-sensitive RabbitMQ configuration
# Mounted as files inside the container at /etc/rabbitmq/
# ------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: rabbitmq-workerservices
data:
  # Main RabbitMQ configuration file
  rabbitmq.conf: |
    default_vhost = /                     # Default virtual host
    disk_free_limit.absolute = 1GB        # Minimum free disk before blocking publishers
  # Plugins to enable on startup
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_peer_discovery_k8s].

---
# ------------------------------------------------------------
# PERSISTENT VOLUME CLAIM
# Requests storage for RabbitMQ data (queues, messages, metadata)
# Uses K3s default local-path storage provisioner
# ⚠️ ReadWriteOnce means only one node can mount this at a time
# ------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-pvc
  namespace: rabbitmq-workerservices
spec:
  accessModes:
    - ReadWriteOnce   # Single node access
  resources:
    requests:
      storage: 5Gi    # Adjust based on expected message volume
  storageClassName: local-path  # K3s built-in provisioner

---
# ------------------------------------------------------------
# DEPLOYMENT
# Defines how RabbitMQ runs as a pod inside the cluster
# Using official rabbitmq:3-management image (includes UI)
# ------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: rabbitmq-workerservices
spec:
  replicas: 1   # Single instance — scale up only with RabbitMQ clustering
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata: 
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672   # AMQP protocol — used by your worker
            - containerPort: 15672  # Management UI — accessible via browser
          env:
            # Injected from Secret — never hardcoded here
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: password
          volumeMounts:
            # Persists RabbitMQ data across pod restarts
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
            # Mounts rabbitmq.conf from ConfigMap
            - name: rabbitmq-config
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf    # Mounts single file, not entire directory
            # Mounts enabled_plugins from ConfigMap
            - name: rabbitmq-plugins
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins  # Mounts single file, not entire directory
      volumes:
        # Binds PVC to the pod for persistent storage
        - name: rabbitmq-data
          persistentVolumeClaim:
            claimName: rabbitmq-pvc
        # Exposes rabbitmq.conf from ConfigMap as a file
        - name: rabbitmq-config
          configMap:
            name: rabbitmq-config
            items:
              - key: rabbitmq.conf
                path: rabbitmq.conf
        # Exposes enabled_plugins from ConfigMap as a file
        - name: rabbitmq-plugins
          configMap:
            name: rabbitmq-config
            items:
              - key: enabled_plugins
                path: enabled_plugins

---
# ------------------------------------------------------------
# SERVICE
# Exposes RabbitMQ inside and outside the cluster
# NodePort makes ports accessible from your local machine
# Your worker connects via: rabbitmq-service:5672
# ------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: rabbitmq-workerservices
spec:
  selector:
    app: rabbitmq   # Targets pods with this label
  ports:
    - name: amqp
      port: 5672        # Port used inside the cluster
      targetPort: 5672  # Port on the RabbitMQ container
    - name: management
      port: 15672        # Port used inside the cluster
      targetPort: 15672  # Management UI port on the container
  type: NodePort